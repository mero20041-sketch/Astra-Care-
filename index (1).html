*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0)}body{margin:0;background:var(--bg);color:var(--w);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;display:flex;min-height:100vh}

.tag{display:inline-block;font:11px 'IBM Plex Mono',monospace;border:1px solid var(--st);color:var(--m);padding:1px 7px;border-radius:3px}.tag.syn{border-color:var(--bad);color:var(--bad)}

label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row>div{min-width:130px}

.lb{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}.lb .card{max-width:420px;width:92%}
@media print{nav,.noprint,#modal{display:none!important}body{display:block}main{padding:0;max-width:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}
input[type=range]{padding:0;width:100%}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav .logo{width:100%}nav button{width:auto}main{padding:14px}}
:root{--bg:#071525;--d:#0A1C30;--p:#0E2238;--s:#1A3550;--m:#A8B7C8;--br:#D6DFEA;--st:#2F6694;--e:#1677D2;--w:#F4F7FB;--mu:#8FA4BA;--ice:#70C7F4;--teal:#28B7A5}

<script>
// ---------- seeded synthetic data (ALL SYNTHETIC) ----------
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const P={hr:{n:'Heart Rate',u:'bpm',min:30,max:220,b:62,sd:3},spo2:{n:'SpO2',u:'%',min:70,max:100,b:97.5,sd:.5},temp:{n:'Body Temperature',u:'°C',min:34,max:42,b:36.7,sd:.15},sleep:{n:'Sleep Duration',u:'h',min:0,max:16,b:7,sd:.5}};
const D0=Date.UTC(2026,9,1);
function gen(seed,k){const r=rng(seed),o=[];for(let d=0;d<30;d++){if(k==='hr'&&d>=17&&d<=19)continue;let v=P[k].b+(r()+r()+r()-1.5)*P[k].sd*1.6;if(k==='hr'&&d===24)v+=17;if(k==='sleep'&&d>=21)v-=1.2;o.push({id:k+d,t:D0+d*864e5,v:+v.toFixed(2),src:'synthetic'});if(k==='temp'&&d===9)o.push({id:k+'dup',t:D0+d*864e5,v:+v.toFixed(2),src:'synthetic'})}return o}
let S={ast:[{id:'AC-001',name:'Crew-A (fictional)',role:'Commander',mission:'DEMO-ODYSSEY',status:'Active',seed:11},{id:'AC-002',name:'Crew-B (fictional)',role:'Flight Engineer',mission:'DEMO-ODYSSEY',status:'Active',seed:23},{id:'AC-003',name:'Crew-C (fictional)',role:'Mission Specialist',mission:'DEMO-ODYSSEY',status:'Standby',seed:37}],imports:[],saved:[]};
try{const x=JSON.parse(localStorage.getItem('astra'));if(x)S=x}catch(e){}
const save=()=>{try{localStorage.setItem('astra',JSON.stringify(S))}catch(e){}};
const series=(a,k)=>gen(a.seed*7+Object.keys(P).indexOf(k),k);
// ---------- stats ----------
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
function analyse(data,k,n=14,w=3,zt=3){const base=data.slice(0,n).map(d=>d.v),m=mean(base),s=sd(base),out=[],seen={},iss=[];
 data.forEach((d,i)=>{const z=s>0?(d.v-m)/s:0,ma=mean(data.slice(Math.max(0,i-w+1),i+1).map(x=>x.v));d.z=z;d.ma=ma;
  const dt=new Date(d.t).toISOString().slice(0,10);
  if(d.v<P[k].min||d.v>P[k].max)iss.push({type:'Invalid value',d,why:`${d.v} ${P[k].u} outside configured range ${P[k].min}–${P[k].max}`});
  if(seen[d.t])iss.push({type:'Duplicate timestamp',d,why:`Another record exists at ${dt}`});seen[d.t]=1;
  if(i>0&&d.t-data[i-1].t>1.5*864e5)iss.push({type:'Missing data',d,why:`${Math.round((d.t-data[i-1].t)/864e5)-1} day(s) without measurements before ${dt}`});
  if(i>=n&&Math.abs(z)>=zt)out.push({d,z,type:'Statistical deviation'})});
 return{m,s,out,iss}}
// ---------- charts ----------
function chart(data,k,o={}){const W=720,H=240,L=46,B=26,T=10,R=10,u=P[k].u;if(!data.length)return'<p class="sub">No data</p>';
 const xs=data.map(d=>d.t),vs=data.map(d=>d.v).concat(o.base?[o.base]:[]);let a=Math.min(...vs),b=Math.max(...vs);const pad=(b-a)*.1||1;a-=pad;b+=pad;
 const x=t=>L+(t-xs[0])/((xs[xs.length-1]-xs[0])||1)*(W-L-R),y=v=>T+(1-(v-a)/(b-a))*(H-T-B);
 let g='';for(let i=0;i<=4;i++){const v=a+(b-a)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1A3550"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>`}
 for(let i=0;i<=5;i++){const t=xs[0]+(xs[xs.length-1]-xs[0])*i/5;g+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle">${new Date(t).toISOString().slice(5,10)}</text>`}
 const pts=data.map(d=>`${x(d.t).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
 let ex=o.base?`<line x1="${L}" x2="${W-R}" y1="${y(o.base)}" y2="${y(o.base)}" stroke="#A8B7C8" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(o.base)-4}" text-anchor="end">baseline ${o.base.toFixed(2)}</text>`:'';
 if(o.ma)ex+=`<polyline fill="none" stroke="#28B7A5" stroke-width="1.5" points="${data.map(d=>`${x(d.t).toFixed(1)},${y(d.ma).toFixed(1)}`).join(' ')}"/>`;
 (o.flag||[]).forEach(d=>ex+=`<circle cx="${x(d.t)}" cy="${y(d.v)}" r="5" fill="none" stroke="#e8a24c" stroke-width="2"/>`);
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${P[k].n} time series, ${data.length} points, unit ${u}. ${(o.flag||[]).length} flagged points.">${g}<text x="4" y="12">${u}</text><polyline fill="none" stroke="#70C7F4" stroke-width="2" points="${pts}"/>${ex}</svg>`}
// ---------- UI ----------
const pages=[['mc','Mission Control'],['pr','Astronaut Profiles'],['hm','Health Monitoring'],['hi','Health Intelligence'],['ck','Daily Check-in'],['ga','Crew Status'],['tl','Mission Timeline'],['as','AI Assistant'],['rad','Radiation'],['ro','Risk Observatory'],['dt','Digital Twin Lab'],['rd','Research Data Center'],['os','NASA OSDR Data'],['oc','OSDR Comparison'],['kl','Knowledge Library'],['rc','Research Comparison'],['ms','Mission Simulation'],['sr','Scientific Reports'],['dm','Data Management'],['mv','Methodology'],['ab','About and Submission'],['st','Settings']];
let page='mc',sel='AC-001',par='hr',q='',fs='All',win=3,zt=3;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=p=>{page=p;q='';render()};
function astSel(){return`<div><label>Astronaut</label><select onchange="sel=this.value;render()">${S.ast.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.id)} – ${esc(a.name)}</option>`).join('')}</select></div>`}
function parSel(){return`<div><label>Parameter</label><select onchange="par=this.value;render()">${Object.keys(P).map(k=>`<option value="${k}"${k===par?' selected':''}>${P[k].n} (${P[k].u})</option>`).join('')}</select></div>`}
const A=()=>S.ast.find(a=>a.id===sel)||S.ast[0];
const SYN='<div class="banner"><b>Synthetic demonstration data.</b> Nothing on this page is real astronaut data. ASTRA CARE is an independent educational project, not an official NASA product, and not a medical diagnostic tool.</div>';
const V={
mc(){const a=A(),cards=Object.keys(P).map(k=>{const d=series(a,k),l=d[d.length-1],p=d[d.length-2],dl=l.v-p.v;return`<div class="card"><div class="k">${P[k].n}</div><div class="v">${cv(k,l.v)}</div><div class="k">prev ${p.v} · ${dl>0.05?'▲':dl<-0.05?'▼':'■'} ${dl.toFixed(2)}</div><div class="k">${new Date(l.t).toISOString().slice(0,10)} · <span class="tag syn">synthetic</span></div></div>`}).join('');
 return`<h1>Mission Control</h1><p class="sub">DEMO-ODYSSEY · fictional mission · day 30 of 180 · crew ${S.ast.length} · status NOMINAL (demo)</p>${SYN}<div class="row">${astSel()}</div><div class="grid">${cards}</div>
 ${Object.keys(P).map(k=>{const d=series(a,k);analyse(d,k);return`<div class="card"><h2>${P[k].n} (${P[k].u})</h2>${chart(d,k,{base:mean(d.slice(0,14).map(x=>x.v)),ma:1})}</div>`}).join('')}`},
pr(){const f=S.ast.filter(a=>(fs==='All'||a.status===fs)&&(a.name+a.id+a.role+a.mission).toLowerCase().includes(q.toLowerCase()));
 return`<h1>Astronaut Profiles</h1><p class="sub">Fictional identifiers only. Stored locally in your browser.</p><div class="row"><div><label>Search</label><input value="${esc(q)}" oninput="q=this.value;render(1)" id="qs"></div><div><label>Status</label><select onchange="fs=this.value;render()">${['All','Active','Standby','Inactive'].map(s=>`<option${s===fs?' selected':''}>${s}</option>`).join('')}</select></div><button class="b pri" onclick="form()">+ Add astronaut</button></div>
 <div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Role</th><th>Mission</th><th>Status</th><th></th></tr>${f.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${esc(a.mission)}</td><td>${esc(a.status)}</td><td><button class="b" onclick="sel='${a.id}';go('hi')">Analyse</button> <button class="b" onclick="form('${a.id}')">Edit</button> <button class="b del" onclick="del('${a.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=6>No profiles match.</td></tr>'}</table></div>`},
hi(){const a=A(),d=series(a,par),r=analyse(d,par,14,win,zt),fl=r.out.map(o=>o.d).concat(r.iss.map(i=>i.d));
 return`<h1>Health Intelligence</h1><p class="sub">Explainable statistics. Baseline = first 14 days. Flags are statistical or data-quality events, never diagnoses.</p>${SYN}
 <div class="row">${astSel()}${parSel()}<div><label>Moving avg window (days)</label><input type="number" min="1" max="14" value="${win}" onchange="win=Math.max(1,+this.value||3);render()" style="width:90px"></div><div><label>|z| threshold</label><input type="number" min="1" max="6" step=".5" value="${zt}" onchange="zt=+this.value||3;render()" style="width:90px"></div></div>
 <div class="card"><h2>${P[par].n} — baseline mean ${r.m.toFixed(2)} ${P[par].u}, SD ${r.s.toFixed(2)}</h2>${chart(d,par,{base:r.m,ma:1,flag:fl})}<p class="sub">Dashed = baseline · thin teal = ${win}-day moving average · amber rings = flagged. <b>z-score</b> = (value − baseline mean) ÷ baseline SD: how many standard deviations a value sits from the personal baseline.</p></div>
 <div class="card"><h2>Notifications (${r.out.length+r.iss.length})</h2>${r.out.map(o=>`<div class="exp"><b>${o.type}</b> — ${P[par].n}<br>Observed ${o.d.v} ${P[par].u} · baseline ${r.m.toFixed(2)} · difference ${(o.d.v-r.m).toFixed(2)} · z = ${o.z.toFixed(2)}<br>Method: z-score vs personal baseline (|z| ≥ ${zt}) · Detected ${new Date().toISOString().slice(0,16)}Z · Source: ${o.d.src}<br><i>Limitations: baseline uses only ${Math.min(14,d.length)} points and assumes roughly normal variation; a deviation is not a medical finding.</i></div>`).join('')}
 ${r.iss.map(i=>`<div class="exp" style="border-color:#e8a24c"><b>Data quality: ${i.type}</b><br>${esc(i.why)} · Method: rule-based validation · Source: ${i.d.src}<br><i>May be a sensor or logging gap rather than a physiological change.</i></div>`).join('')}${r.out.length+r.iss.length?'':'<p class="sub">Nothing flagged.</p>'}</div>${ciCard(a)}`},
ro(){const R=[['Cardiovascular Adaptation','Fluid shifts and reduced gravitational load change cardiac and vascular function in orbit.','https://www.nasa.gov/hhp/human-system-risks/'],['Bone Loss','Weight-bearing bones lose density without gravity loading.','https://www.nasa.gov/hhp/human-system-risks/'],['Muscle Atrophy','Reduced load leads to muscle mass and strength decline.','https://www.nasa.gov/hhp/human-system-risks/'],['Space Radiation','Exposure beyond low Earth orbit raises long-term health concerns.','https://www.nasa.gov/hrp/'],['Sleep Disruption','Light cycles and schedules disturb circadian rhythms.','https://www.nasa.gov/hrp/'],['SANS','Spaceflight-Associated Neuro-ocular Syndrome: eye and optic-nerve changes in some crew.','https://www.nasa.gov/hhp/human-system-risks/']];
 return`<h1>Risk Observatory</h1><p class="sub">Educational overviews only. Full evidence summaries must be written from the linked NASA sources; this prototype covers ${R.length} of 10 categories.</p>${R.map(r=>`<div class="card"><h2>${r[0]}</h2><p>${r[1]}</p><span class="tag">educational overview</span> <a href="${r[2]}" target="_blank" rel="noopener">NASA source ↗</a></div>`).join('')}`},
rd(){const L=[['NASA Open Science Data Repository','https://osdr.nasa.gov/','Space biology datasets (mostly animal, plant, cell; some human)'],['OSDR Visualization','https://visualization.osdr.nasa.gov/','Visual exploration of OSDR data'],['NASA Life Sciences Portal','https://nlsp.nasa.gov/','Life sciences discovery portal'],['Human Research Program','https://www.nasa.gov/hrp/','Human health risk research'],['Ames Life Sciences Data Archive','https://www.nasa.gov/ames/space-biosciences/ames-life-sciences-data-archive/','Archived life-science experiment data'],['Human Health and Performance','https://www.nasa.gov/hhp/','HHP directorate resources'],['Human System Risks','https://www.nasa.gov/hhp/human-system-risks/','Risk evidence reports'],['NASA Technical Standards','https://standards.nasa.gov/','Health & medical standards']];
 const f=L.filter(l=>(l[0]+l[2]).toLowerCase().includes(q.toLowerCase()));
